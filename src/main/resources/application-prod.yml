# Perfil "prod": PostgreSQL. Se activa con SPRING_PROFILES_ACTIVE=prod.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ferreteria}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update   # mejora pendiente: reemplazar por migraciones Flyway
